<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>作业指引 · YUANsys</title>
<meta name="description" content="课程作业入口：MLP 学习参数实验室与 PPT 作业。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b1220'/%3E%3Cpath d='M8 22V10l8 7 8-7v12' fill='none' stroke='%2338bdf8' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #070c15;
    --panel: #0d1626;
    --line: #1e2c42;
    --text: #e7eefb;
    --muted: #8ba0bb;
    --accent: #38bdf8;
    --font: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1000px 520px at 20% -12%, #15283f 0%, rgba(9, 14, 24, 0) 62%),
      radial-gradient(900px 460px at 96% 6%, #12233a 0%, rgba(9, 14, 24, 0) 58%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 56px 24px 48px; }

  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 46px; }
  .mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 13px;
    font-size: 15px; font-weight: 700; color: #04121f;
    background: linear-gradient(140deg, #7dd3fc, #38bdf8 55%, #0ea5e9);
    box-shadow: 0 10px 26px -12px rgba(56, 189, 248, 0.95);
  }
  .top-text { font-size: 13px; color: var(--muted); letter-spacing: 0.05em; }
  .top-text b { display: block; font-size: 14px; color: #cfe0f2; letter-spacing: 0.02em; margin-bottom: 3px; }

  h1 {
    margin: 0 0 40px;
    font-size: clamp(30px, 5vw, 42px);
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

  .card {
    position: relative;
    display: block;
    padding: 26px 24px 24px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(19, 30, 47, 0.95), rgba(11, 19, 32, 0.95));
    color: inherit;
    text-decoration: none;
    overflow: hidden;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: auto -30% -60% -30%;
    height: 150px;
    background: radial-gradient(closest-side, rgba(56, 189, 248, 0.16), transparent);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #2e6a92;
    box-shadow: 0 22px 44px -28px rgba(56, 189, 248, 0.8);
  }
  .card:hover::after { opacity: 1; }

  .no {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: #4f6b8c;
    font-variant-numeric: tabular-nums;
  }
  .card h2 {
    margin: 12px 0 8px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .card p {
    margin: 0 0 22px;
    font-size: 12.5px;
    line-height: 1.85;
    color: var(--muted);
    min-height: 46px;
  }
  .go {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .go svg { transition: transform 0.18s ease; }
  .card:hover .go svg { transform: translateX(4px); }

  .foot {
    margin-top: 44px;
    padding-top: 16px;
    border-top: 1px solid rgba(30, 44, 66, 0.7);
    font-size: 11.5px;
    color: #6f83a0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  @media (max-width: 720px) {
    .wrap { padding: 36px 18px 34px; }
    .cards { grid-template-columns: minmax(0, 1fr); }
    .card p { min-height: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="mark">M</span>
    <div class="top-text">
      <b>YUANsys.github.io</b>
      课程作业合集
    </div>
  </div>

  <h1>作业指引</h1>

  <div class="cards">
    <a class="card" href="mlp/">
      <span class="no">01 / MLP</span>
      <h2>MLP 学习参数实验室</h2>
      <p>从零手写多层感知机，实时可视化决策边界、损失与准确率、参数连接图和权重分布，可自由调整学习率、动量、激活函数与网络结构。</p>
      <span class="go">进入演示
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </span>
    </a>

    <a class="card" href="ppt/">
      <span class="no">02 / PPT</span>
      <h2>PPT 作业 · Agent 使用报告</h2>
      <p>以「Agent 使用报告 —— Trae Code」为主题的演示文稿，包含制作过程、能力评估、案例与结论。</p>
      <span class="go">进入页面
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </span>
    </a>
  </div>

  <div class="foot">
    <span>Updated 2026 · Hosted on GitHub Pages</span>
    <span>YUANsys</span>
  </div>
</div>
</body>
</html>

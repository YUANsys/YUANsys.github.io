<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PPT 作业 · YUANsys</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b1220'/%3E%3Cpath d='M8 22V10l8 7 8-7v12' fill='none' stroke='%2338bdf8' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #070c15;
    --line: #1e2c42;
    --text: #e7eefb;
    --muted: #8ba0bb;
    --accent: #38bdf8;
    --font: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background:
      radial-gradient(900px 460px at 24% -10%, #15283f 0%, rgba(9, 14, 24, 0) 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .box {
    width: 100%;
    max-width: 560px;
    padding: 36px 32px 30px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(19, 30, 47, 0.96), rgba(11, 19, 32, 0.96));
    text-align: left;
  }
  .no { font-size: 12px; letter-spacing: 0.16em; color: #4f6b8c; }
  h1 { margin: 12px 0 10px; font-size: 26px; font-weight: 600; }
  p { margin: 0 0 8px; font-size: 13px; line-height: 1.9; color: var(--muted); }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding: 7px 13px;
    border: 1px solid #2a4a63;
    border-radius: 999px;
    font-size: 12px;
    color: #b6d9f0;
    background: rgba(56, 189, 248, 0.08);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  a.back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 26px;
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
  }
  a.back:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="box">
    <span class="no">02 / PPT</span>
    <h1>PPT 作业</h1>
    <p>这个页面已经预留好位置，内容正在整理中。</p>
    <p>等 PPT 作业完成后，会在这里展示完整的演示内容。</p>
    <div class="status"><span class="dot"></span>即将上线</div>
    <br />
    <a class="back" href="../">← 返回作业指引</a>
  </div>
</body>
</html>
